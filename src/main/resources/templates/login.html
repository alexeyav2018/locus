<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Вход — Locus</title>
</head>
<body>
<main id="main" class="auth">
    <div class="auth-card">
        <div class="auth-brand"><span class="brand-mark" aria-hidden="true"></span>Locus</div>
        <div class="card">
            <h1>Вход</h1>
            <p class="lead">Рабочее место учителя математики.</p>

            <div class="alert" role="alert" th:if="${error}"><p th:text="${error}">Неверное имя входа или пароль</p></div>
            <div class="alert alert--notice" role="status" th:if="${notice}"><p th:text="${notice}">Сеанс завершён</p></div>

            <form method="post" th:action="@{/login}">
                <label for="username">Имя входа
                    <input type="text" id="username" name="username" autofocus autocomplete="username"
                           autocapitalize="none" spellcheck="false">
                </label>
                <label for="password">Пароль
                    <input type="password" id="password" name="password" autocomplete="current-password">
                </label>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/shell :: footer}"/>
</body>
</html>

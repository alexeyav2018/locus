<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Locus</title>
</head>
<body>
<h1>Locus</h1>

<p>Вошли как <span th:text="${login}">admin</span>.</p>
<p>Из прикладного построен рубрикатор; задачи и ученики появятся позже.</p>

<ul>
    <li><a th:href="@{/taxonomy}">Рубрикатор</a></li>
    <li th:if="${administrator}"><a th:href="@{/users}">Учётные записи</a></li>
    <li><a th:href="@{/password}">Сменить пароль</a></li>
</ul>

<form method="post" th:action="@{/logout}">
    <button type="submit">Выйти</button>
</form>
</body>
</html>

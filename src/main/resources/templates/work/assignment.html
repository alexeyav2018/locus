<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <!--/* Экран рассчитан на телефон: снимки решений учитель загружает
           там же, где их получил, — в мессенджере на телефоне (ADR-0015,
           предпосылка П2). viewport — чтобы страница масштабировалась под
           ширину устройства; ниже — ни таблиц, ни фиксированных ширин. */-->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Приём Работ — Locus</title>
    <!--/*
        Экран приёма по Заданию (С5): Ученик, срок, «не сдано», и по каждой
        Задаче состава — либо принятая Работа с файлами, датой получения,
        вердиктом и примечанием и действиями над ней, либо форма приёма.

        На паре «Задание × Задача» Работа одна (ADR-0038): повторная
        присылка — «добавить файлы» к ней, а не вторая форма приёма.
        Вердикт отделён от приёма: Работа без вердикта показана как
        «не проверена», и это единственный способ о ней узнать —
        уведомлений нет (ADR-0017). Последний файл не удаляется: Работа
        без файла не существует, удаляется Работа целиком.

        Файлы — только по временной подписанной ссылке (ADR-0021): ключ
        хранилища в разметку не попадает, ссылка считается при показе
        и живёт минуты. Открывается в новой вкладке: страница за ней должна
        остаться.

        Отметок Владения здесь пока нет — долг mastery-marks: место им
        на этом же экране, рядом с вердиктом.

        «Не сдано» приходит из сервиса вычисленным (инвариант 12).
    */-->
    <style>
        body { max-width: 40rem; margin: 0 auto; padding: 0 0.75rem; }
        form { display: flex; flex-direction: column; align-items: stretch; gap: 0.6rem; margin: 0 0 1.25rem; }
        form.inline { flex-direction: row; align-items: center; margin: 0; }
        input, textarea, button { font: inherit; max-width: 100%; box-sizing: border-box; }
        input[type=date], textarea { padding: 0.35rem; width: 100%; }
        textarea { min-height: 3.5rem; }
        button { padding: 0.5rem 0.9rem; }
        .problem { border-top: 1px solid #ccc; padding: 0.75rem 0; }
        .marks { margin: 0.15rem 0 0; color: #444; }
        .files { margin: 0.35rem 0; padding-left: 1.25rem; }
        .files li { margin: 0.25rem 0; }
        .error { color: #a00; }
    </style>
</head>
<body>
<h1 th:text="'Работы: ' + ${listed.studentName}">Работы: Иванов Пётр</h1>

<p class="error" th:if="${error}" th:text="${error}">Нужен хотя бы один файл</p>

<p>Задание: <a th:href="@{/assignments/{id}(id=${listed.assignment.id.value})}"
               th:text="'срок ' + ${#temporals.format(listed.assignment.dueDate, 'dd.MM.yyyy')}">срок 08.09.2026</a></p>
<!--/* «Не сдано» — одним словом в одном th:text, как на странице Задания. */-->
<p th:if="${listed.notSubmitted}" th:text="'не сдано'">не сдано</p>

<div class="problem" th:each="problem : ${problems}"
     th:with="work=${works.get(problem.problem.id)}">
    <h2>
        <a th:href="@{/problems/{id}(id=${problem.problem.id.value})}"
           th:text="'№ ' + ${problem.number}">№ 12</a>
        <span th:if="${problem.problem.hasCaption}"
              th:text="${problem.problem.caption}">Ященко, вариант 12</span>
    </h2>
    <!--/* Темы и Методы одной фразой: на телефоне каждая строка дорога. */-->
    <p class="marks"
       th:text="'Темы: ' + ${#strings.listJoin(problem.topicPaths, '; ')} + '. Методы: ' + ${#strings.listJoin(problem.methodNames, ', ')}">Темы: Алгебра / Уравнения. Методы: Замена переменной</p>

    <!--/* Работа принята: дата, вердикт или «не проверена», примечание,
           файлы и действия. */-->
    <div th:if="${work != null}">
        <p th:text="'получена ' + ${#temporals.format(work.receivedOn, 'dd.MM.yyyy')}">получена 03.09.2026</p>
        <p th:if="${work.checked}" th:text="'Вердикт: ' + ${work.verdict.title}">Вердикт: верно</p>
        <p th:unless="${work.checked}" th:text="'не проверена'">не проверена</p>
        <p th:if="${work.hasNote}" th:text="'Примечание: ' + ${work.note}">Примечание: потерян корень</p>

        <ul class="files">
            <li th:each="linked, stat : ${files.get(problem.problem.id)}">
                <a th:href="${linked.link}" target="_blank" rel="noopener"
                   th:text="'файл ' + ${stat.count}">файл 1</a>
                <form class="inline" method="post"
                      th:action="@{/works/{id}/files/{fileId}/deletion(id=${work.id.value},fileId=${linked.file.id.value})}">
                    <button type="submit">Удалить файл</button>
                </form>
            </li>
        </ul>

        <form method="post" enctype="multipart/form-data"
              th:action="@{/works/{id}/files(id=${work.id.value})}">
            <label>Добавить файлы
                <input type="file" name="files" multiple accept="image/*,application/pdf">
            </label>
            <button type="submit">Добавить файлы</button>
        </form>

        <!--/* Вердикт и примечание — одной формой: на экране они рядом,
               и примечание без вердикта («посмотрю позже») законно. */-->
        <form method="post" th:action="@{/works/{id}/verdict(id=${work.id.value})}">
            <label th:each="one : ${verdicts}">
                <input type="radio" name="verdict" th:value="${one.name()}"
                       th:checked="${work.verdict == one}">
                <span th:text="${one.title}">верно</span>
            </label>
            <label>
                <input type="radio" name="verdict" value="" th:checked="${work.verdict == null}">
                не проверять сейчас
            </label>
            <label>Примечание
                <textarea name="note" th:text="${work.note}"></textarea>
            </label>
            <button type="submit">Сохранить вердикт</button>
        </form>

        <form method="post" th:action="@{/works/{id}/deletion(id=${work.id.value})}">
            <button type="submit">Удалить Работу</button>
        </form>
    </div>

    <!--/* Работы нет — форма приёма. Задание и Задача — в адресе формы,
           а не только в теле: при превышении предела загрузки тело
           не разбирается, и экран приёма надо найти по адресу. */-->
    <form th:if="${work == null}" method="post" enctype="multipart/form-data"
          th:action="@{/works(assignment=${listed.assignment.id.value},problem=${problem.problem.id.value})}">
        <label>Файлы решения
            <input type="file" name="files" multiple accept="image/*,application/pdf">
        </label>
        <label>Дата получения
            <input type="date" name="receivedOn" th:value="${today}">
        </label>
        <label th:each="one : ${verdicts}">
            <input type="radio" name="verdict" th:value="${one.name()}">
            <span th:text="${one.title}">верно</span>
        </label>
        <label>
            <input type="radio" name="verdict" value="" checked>
            не проверять сейчас
        </label>
        <label>Примечание
            <textarea name="note"></textarea>
        </label>
        <button type="submit">Принять Работу</button>
    </form>
</div>

<p><a th:href="@{/works(student=${listed.assignment.student.value})}">Работы Ученика</a></p>
<p><a th:href="@{/assignments/{id}(id=${listed.assignment.id.value})}">К Заданию</a></p>
</body>
</html>

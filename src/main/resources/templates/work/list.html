<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <!--/* Как и экран приёма — под телефон (ADR-0015). */-->
    <title>Работы Ученика — Locus</title>
    <!--/*
        Работы одного Ученика, новые первыми: дата получения, вердикт или
        «не проверена», номер Задачи, ссылка на экран приёма Задания —
        «вернуться к прошлым работам» (ADR-0015). Список уже отфильтрован
        по владельцу — шаблон о владельце не знает и знать не должен.

        Без таблицы: на узком экране строка из четырёх колонок не помещается,
        а список читается сверху вниз.
    */-->
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--narrow">
<p class="back"><a th:href="@{${shell.backOr('/students/' + student.id.value)}}">← К Ученику</a></p>
<div class="page-head">
    <div>
        <h1 th:text="'Работы: ' + ${student.name}">Работы: Иванов Пётр</h1>
        <p class="lead">Новые первыми.</p>
    </div>
    <span class="scope scope--personal">Мой кабинет</span>
</div>

<p class="empty" th:if="${#lists.isEmpty(works)}">Работ от Ученика пока не принято.</p>
<ul class="items works" th:unless="${#lists.isEmpty(works)}">
    <li class="item" th:each="work : ${works}">
        <span class="muted" th:text="${#temporals.format(work.receivedOn, 'dd.MM.yyyy')}">03.09.2026</span>
        <span class="grow item-title" th:text="'Задача № ' + ${work.problem.value}">Задача № 12</span>
        <span class="badge badge--ok" th:if="${work.checked and work.verdict.name() == 'CORRECT'}" th:text="${work.verdict.title}">верно</span>
        <span class="badge badge--bad" th:if="${work.checked and work.verdict.name() != 'CORRECT'}" th:text="${work.verdict.title}">неверно</span>
        <span class="badge badge--warn" th:unless="${work.checked}" th:text="'не проверена'">не проверена</span>
        <a class="btn btn-sm" th:href="@{/works(assignment=${work.assignment.value},from=${shell.here})}">к Заданию</a>
    </li>
</ul>
</main>
</body>
</html>

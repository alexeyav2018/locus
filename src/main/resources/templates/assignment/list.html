<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Задания — Locus</title>
    <!--/*
        Сводка Заданий вошедшего Учителя с отбором по Ученику, Раздаче,
        периоду срока и переключателем «только несданные» (С7). Форма идёт
        методом GET, как поиск по библиотеке: условия в адресе, и на «кто
        из 9Б не сдал» можно вернуться по ссылке.

        Заданий здесь не заводят: выдача начинается с поиска по библиотеке
        (С4), где Задачи отмечаются в результатах. Пустой сводке об этом
        сказано словами, чтобы Учитель не искал кнопку.

        «Не сдано» приходит из сервиса вычисленным (инвариант 12): шаблон
        показывает признак, а не сравнивает даты. Список уже отфильтрован
        по владельцу — шаблон о владельце не знает и знать не должен.
    */-->
    <style>
        form { max-width: 52rem; }
        fieldset { margin: 0 0 1.5rem; padding: 0.75rem 1rem 1rem; }
        legend { padding: 0 0.35rem; }
        label { display: block; margin: 0.35rem 0; }
        select { padding: 0.35rem; min-width: 22rem; }
        input[type=date] { padding: 0.35rem; }
        button { padding: 0.35rem 0.9rem; }
        table { border-collapse: collapse; }
        th, td { padding: 0.35rem 0.75rem; text-align: left; border-bottom: 1px solid #ccc; }
    </style>
</head>
<body>
<h1>Задания</h1>

<p th:if="${error}" th:text="${error}">Начало периода позже его конца</p>

<form method="get" th:action="@{/assignments}">
    <fieldset>
        <legend>Отбор</legend>
        <label>Ученик
            <select name="student">
                <option value="">— любой —</option>
                <option th:each="one : ${students}"
                        th:value="${one.id.value}"
                        th:text="${one.name}"
                        th:selected="${filter.student == one.id}">Иванов Пётр</option>
            </select>
        </label>
        <!--/* Раздача названа именем Группы на момент выдачи и датой:
               Группу с тех пор могли переименовать или удалить, а Раздача
               помнит, кому и когда выдавали (ADR-0016). */-->
        <label>Раздача
            <select name="batch">
                <option value="">— любая —</option>
                <option th:each="one : ${batches}"
                        th:value="${one.id.value}"
                        th:text="'«' + ${one.groupName} + '» от ' + ${#temporals.format(one.issuedOn, 'dd.MM.yyyy')}"
                        th:selected="${filter.batch == one.id}">«9Б» от 01.09.2026</option>
            </select>
        </label>
        <label>Срок от <input type="date" name="from" th:value="${filter.from}"></label>
        <label>Срок до <input type="date" name="to" th:value="${filter.to}"></label>
        <label>
            <input type="checkbox" name="notSubmitted" value="true" th:checked="${filter.onlyNotSubmitted}">
            только несданные
        </label>
    </fieldset>
    <button type="submit">Отобрать</button>
</form>

<p th:if="${#lists.isEmpty(assignments)}">Заданий по этим условиям нет. Выдача начинается
    с <a th:href="@{/problems}">поиска по библиотеке</a>: отметьте найденные Задачи
    и нажмите «Выдать отмеченные».</p>

<table th:unless="${#lists.isEmpty(assignments)}">
    <thead>
    <tr>
        <th>Ученик</th>
        <th>Выдано</th>
        <th>Срок</th>
        <th>Задач</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${assignments}" th:id="'assignment-' + ${item.assignment.id.value}">
        <td><a th:href="@{/assignments/{id}(id=${item.assignment.id.value})}"
               th:text="${item.studentName}">Иванов Пётр</a></td>
        <td th:text="${#temporals.format(item.assignment.issuedOn, 'dd.MM.yyyy')}">01.09.2026</td>
        <td th:text="${#temporals.format(item.assignment.dueDate, 'dd.MM.yyyy')}">08.09.2026</td>
        <td th:text="${#lists.size(item.assignment.problems)}">3</td>
        <!--/* «Не сдано» — одним словом в одном th:text: человек видит его
               слитно, и тест ищет его целиком, а не по кускам разметки. */-->
        <td><span th:if="${item.notSubmitted}" th:text="'не сдано'">не сдано</span></td>
    </tr>
    </tbody>
</table>

<p><a th:href="@{/}">На главную</a></p>
</body>
</html>

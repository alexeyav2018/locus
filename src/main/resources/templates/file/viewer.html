<!DOCTYPE html>
<!--/*
    Просмотр файла внутри системы (ADR-0042): картинка либо страницы PDF
    и кнопка «Назад» — вместо ссылки в чужую вкладку, из которой выходят
    средствами браузера. Ссылка на файл временная и подписанная (ADR-0021);
    она считается при показе страницы и живёт минуты.

    PDF показывается столбцом картинок страниц, отрисованных на сервере
    (ADR-0052), — встроенный просмотр PDF есть не во всех браузерах.
    Показаны первые двадцать страниц; за остальными, за выделением текста
    и за PDF, который не разобрался, — кнопка «Открыть PDF», она есть всегда.
*/-->
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title th:text="${view.title} + ' — Locus'">Файл — Locus</title>
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--medium">
    <p class="back"><a th:href="@{${shell.backOr(view.fallback)}}">← Назад</a></p>
    <div class="page-head">
        <h1 th:text="${view.title}">Файл</h1>
    </div>

    <div class="viewer">
        <img th:if="${view.image}" th:src="${view.link}" th:alt="${view.title}">
        <div th:unless="${view.image or view.unreadable}" class="viewer-pages">
            <img th:each="page : ${view.pages}" th:src="@{${page.src}}" loading="lazy"
                 th:width="${page.width}" th:height="${page.height}" th:alt="'Страница ' + ${page.number}">
        </div>
        <p th:if="${view.unreadable}" class="viewer-fallback">Показать этот PDF на странице не удалось.</p>
    </div>

    <p th:if="${view.truncated}" class="hint"
       th:text="'Показаны первые ' + ${#lists.size(view.pages)} + ' из ' + ${view.total} + ' страниц. Остальные — в «Открыть PDF».'">Показаны первые 20 из 30 страниц.</p>

    <div class="row">
        <a class="btn btn-primary" th:href="@{${shell.backOr(view.fallback)}}">Назад</a>
        <a class="btn" th:unless="${view.image}" th:href="${view.link}" target="_blank" rel="noopener">Открыть PDF</a>
    </div>
</main>
<th:block th:replace="~{fragments/shell :: footer}"/>
</body>
</html>

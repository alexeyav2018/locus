<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Группы — Locus</title>
    <!--/*
        Список Групп вошедшего Учителя и форма заведения на той же странице —
        по тем же соображениям, что у списка Учеников. Имя Группы уникально
        у одного владельца без учёта регистра; отказ показывается здесь же.
    */-->
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--medium">
<div class="page-head">
    <div>
        <h1>Группы</h1>
        <p class="lead">Списки Учеников для общей выдачи Заданий.</p>
    </div>
    <span class="scope scope--personal">Мой кабинет</span>
</div>

<p class="alert" role="alert" th:if="${error}" th:text="${error}">Группа с таким именем у вас уже есть</p>

<p class="empty" th:if="${#lists.isEmpty(groups)}">Групп пока нет.</p>
<ul class="items">
    <li class="item" th:each="group : ${groups}" th:id="'group-' + ${group.id.value}">
        <a th:href="@{/groups/{id}(id=${group.id.value},from=${shell.here})}" th:text="${group.name}">9Б</a>
    </li>
</ul>

<details class="more more--primary" th:attr="open=${shell.opened('/groups')} ? 'open'">
    <summary>Завести Группу</summary>
    <div class="more-body">
        <form class="inline-form" method="post" th:action="@{/groups}">
            <label>Имя <input type="text" name="name" autocomplete="off" th:value="${shell.echo('name', '/groups')}"></label>
            <button type="submit" class="btn-primary">Завести</button>
            <button type="button" data-close>Отмена</button>
        </form>
    </div>
</details>
</main>
</body>
</html>

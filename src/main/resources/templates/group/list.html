<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Группы — Locus</title>
    <!--/*
        Список Групп вошедшего Учителя и форма заведения на той же странице —
        по тем же соображениям, что у списка Учеников. Имя Группы уникально
        у одного владельца без учёта регистра; отказ показывается здесь же.
    */-->
    <style>
        form { display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem; }
        input[type=text] { padding: 0.35rem; min-width: 16rem; max-width: 100%; }
        button { padding: 0.35rem 0.9rem; }
    </style>
</head>
<body>
<h1>Группы</h1>

<p th:if="${error}" th:text="${error}">Группа с таким именем у вас уже есть</p>

<p th:if="${#lists.isEmpty(groups)}">Групп пока нет.</p>
<ul>
    <li th:each="group : ${groups}" th:id="'group-' + ${group.id.value}">
        <a th:href="@{/groups/{id}(id=${group.id.value})}" th:text="${group.name}">9Б</a>
    </li>
</ul>

<h2>Завести Группу</h2>
<form method="post" th:action="@{/groups}">
    <label>Имя <input type="text" name="name"></label>
    <button type="submit">Завести</button>
</form>

<p><a th:href="@{/}">На главную</a></p>
</body>
</html>

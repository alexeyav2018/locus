<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Ученик — Locus</title>
    <!--/*
        Карточка Ученика: имя, Группы, в которых он состоит, переименование,
        выбытие и удаление. Состав Групп правится на странице Группы, а не
        здесь: состав — свойство Группы и задаётся целиком одной формой.

        Удаление отказывает, пока на Ученика что-нибудь ссылается
        (ADR-0035) — его Задания и Работы. Сообщение об отказе
        показывается здесь же.

        Выбытие — состояние, а не удаление (ADR-0040): кнопка переключается
        в зависимости от текущего состояния и ни на что другое не влияет.

        Ссылки на Задания, Работы и Владение — только адреса: область
        Учеников в коде не знает ни одной из этих областей (mastery-views).
    */-->
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--medium">
<p class="back"><a th:href="@{/students}">← К списку Учеников</a></p>
<div class="page-head">
    <div>
        <h1 th:text="${student.name}">Иванов Пётр</h1>
        <p><span class="badge badge--warn" th:if="${student.withdrawn}">Выбыл</span></p>
    </div>
    <span class="scope scope--personal">Мой кабинет</span>
</div>

<p class="alert" role="alert" th:if="${error}" th:text="${error}">Имя Ученика не может быть пустым</p>

<div class="tiles">
    <a class="tile tile--personal" th:href="@{/mastery(student=${student.id.value})}">
        <span class="tile-title">Владение</span><span class="tile-text">Где силён, где пробелы</span></a>
    <a class="tile tile--personal" th:href="@{/works(student=${student.id.value})}">
        <span class="tile-title">Работы Ученика</span><span class="tile-text">Что принято и проверено</span></a>
    <a class="tile tile--personal" th:href="@{/assignments(student=${student.id.value})}">
        <span class="tile-title">Задания Ученика</span><span class="tile-text">Что выдано и что не сдано</span></a>
</div>

<h2>Группы</h2>
<p class="empty" th:if="${#lists.isEmpty(groups)}">Ни в одной Группе не состоит.</p>
<ul class="items">
    <li class="item" th:each="group : ${groups}">
        <a th:href="@{/groups/{id}(id=${group.id.value})}" th:text="${group.name}">9Б</a>
    </li>
</ul>

<!--/* Только адрес: о Заданиях эта область в коде не знает,
       сводка сама отберёт по Ученику. */-->
<h2>Действия</h2>
<form class="inline-form" method="post" th:action="@{/students/{id}/name(id=${student.id.value})}">
    <label>Новое имя <input type="text" name="name" th:value="${student.name}"></label>
    <button type="submit">Переименовать</button>
</form>

<div class="row">
    <form class="inline" th:if="${!student.withdrawn}" method="post" th:action="@{/students/{id}/withdrawal(id=${student.id.value})}">
        <button type="submit">Пометить выбывшим</button>
    </form>
    <form class="inline" th:if="${student.withdrawn}" method="post" th:action="@{/students/{id}/withdrawal/undo(id=${student.id.value})}">
        <button type="submit">Вернуть</button>
    </form>
</div>

<div class="danger-zone">
    <form method="post" data-confirm="Это действие необратимо."
          th:action="@{/students/{id}/deletion(id=${student.id.value})}">
        <button type="submit" class="btn-danger">Удалить Ученика</button>
    </form>
</div>
</main>
</body>
</html>

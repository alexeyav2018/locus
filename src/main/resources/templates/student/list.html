<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Ученики — Locus</title>
    <!--/*
        Список Учеников вошедшего Учителя и форма заведения на той же
        странице: Учитель без единого Ученика иначе увидел бы пустой экран
        и не знал бы, что делать (design.md, «Риски»).

        Форм правки и признака роли здесь нет: экран целиком доступен
        только Учителю, а Пользователь без роли до шаблона не доходит.
        Вычислений в шаблоне нет: список собран сервисом уже отфильтрованным
        по владельцу — шаблон о владельце не знает и знать не должен.

        Переключатель «показать выбывших» — GET-форма с условием в адресе
        (`/students?withdrawn=true`), как у отбора Заданий: список
        либо действующих, либо выбывших, а не двух вместе (ADR-0040).
    */-->
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--medium">
<div class="page-head">
    <div>
        <h1 th:text="${showingWithdrawn} ? 'Ученики — выбывшие' : 'Ученики'">Ученики</h1>
        <p class="lead">Ваши Ученики. Другие Учителя их не видят.</p>
    </div>
    <span class="scope scope--personal">Мой кабинет</span>
</div>

<p class="alert" role="alert" th:if="${error}" th:text="${error}">Имя Ученика не может быть пустым</p>

<p>
    <a class="btn btn-sm" th:unless="${showingWithdrawn}" th:href="@{/students(withdrawn=true)}">Показать выбывших</a>
    <a class="btn btn-sm" th:if="${showingWithdrawn}" th:href="@{/students}">К действующим</a>
</p>

<p class="empty" th:if="${#lists.isEmpty(students)}"
   th:text="${showingWithdrawn} ? 'Выбывших Учеников нет.' : 'Учеников пока нет.'">Учеников пока нет.</p>
<ul class="items">
    <li class="item" th:each="student : ${students}" th:id="'student-' + ${student.id.value}">
        <a class="grow" th:href="@{/students/{id}(id=${student.id.value},from=${shell.here})}" th:text="${student.name}">Иванов Пётр</a>
        <span class="badge" th:if="${student.withdrawn}">(выбыл)</span>
        <a class="btn btn-sm" th:href="@{/mastery(student=${student.id.value},from=${shell.here})}">Владение</a>
        <a class="btn btn-sm" th:href="@{/works(student=${student.id.value},from=${shell.here})}">Работы</a>
    </li>
</ul>

<details class="more more--primary" th:unless="${showingWithdrawn}" th:attr="open=${shell.opened('/students')} ? 'open'">
    <summary>Завести Ученика</summary>
    <div class="more-body">
        <form class="inline-form" method="post" th:action="@{/students}">
            <label>Имя <input type="text" name="name" autocomplete="off" th:value="${shell.echo('name', '/students')}"></label>
            <button type="submit" class="btn-primary">Завести</button>
            <button type="button" data-close>Отмена</button>
        </form>
    </div>
</details>
</main>
<th:block th:replace="~{fragments/shell :: footer}"/>
</body>
</html>

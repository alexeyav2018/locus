<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Смена пароля — Locus</title>
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--narrow">
    <h1>Смена пароля</h1>

    <p class="alert" role="alert" th:if="${error}" th:text="${error}">Текущий пароль указан неверно</p>

    <form class="card" method="post" th:action="@{/password}">
        <label for="currentPassword">Текущий пароль
            <input type="password" id="currentPassword" name="currentPassword" autocomplete="current-password">
        </label>
        <label for="newPassword">Новый пароль
            <input type="password" id="newPassword" name="newPassword" autocomplete="new-password">
        </label>
        <button type="submit" class="btn-primary">Сменить пароль</button>
    </form>

    <form method="post" th:action="@{/logout}">
        <button type="submit">Выйти</button>
    </form>
</main>
</body>
</html>

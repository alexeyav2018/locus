<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/shell :: head}"/>
    <title>Учётные записи — Locus</title>
</head>
<body>
<th:block th:replace="~{fragments/shell :: header}"/>
<main id="main" class="page page--medium">
    <div class="page-head">
        <div>
            <h1>Учётные записи</h1>
            <p class="lead">Кто может войти в систему и с какими ролями.</p>
        </div>
    </div>

    <p class="alert" role="alert" th:if="${error}" th:text="${error}">Имя входа занято</p>

    <div class="table-wrap">
        <table>
            <thead>
            <tr>
                <th>Имя входа</th>
                <th>Роли</th>
                <th>Пароль</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td><strong th:text="${user.login}">admin</strong></td>
                <td>
                    <div class="row">
                        <form class="inline" method="post" th:each="role : ${roles}"
                              th:action="@{/users/{id}/roles(id=${user.id.value})}">
                            <input type="hidden" name="role" th:value="${role}">
                            <input type="hidden" name="assign" th:value="${!user.hasRole(role)}">
                            <button type="submit" class="btn-sm"
                                    th:classappend="${user.hasRole(role)} ? 'btn-danger'"
                                    th:text="${user.hasRole(role) ? 'Снять ' + role : 'Назначить ' + role}">Назначить</button>
                        </form>
                    </div>
                </td>
                <td>
                    <form class="inline-form" method="post" th:action="@{/users/{id}/password(id=${user.id.value})}">
                        <input type="password" name="newPassword" aria-label="Новый пароль" autocomplete="new-password">
                        <button type="submit" class="btn-sm">Сбросить пароль</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <h2>Завести учётную запись</h2>
    <form class="card" method="post" th:action="@{/users}">
        <label for="login">Имя входа
            <input type="text" id="login" name="login" autocomplete="off" autocapitalize="none">
        </label>
        <label for="initialPassword">Начальный пароль
            <input type="password" id="initialPassword" name="initialPassword" autocomplete="new-password">
        </label>
        <p class="hint">Пользователь сменит его при первом входе.</p>
        <button type="submit" class="btn-primary">Завести</button>
    </form>
</main>
</body>
</html>

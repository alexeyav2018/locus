# Подписи у Задачи больше нет: Задача различается только номером — своим id
# (ADR-0050, заменяет ADR-0029).
#
# Колонка удаляется вместе с уже введёнными значениями — необратимо, откатного
# скрипта нет (ADR-0023). Перед выкладкой на стенд нужна копия базы. Оставить
# колонку пустой не стали: поле, которое никто не заполняет и не показывает,
# говорило бы читающему схему, что Подпись у Задачи есть.
databaseChangeLog:
  - changeSet:
      id: 0014-problem-caption-removal
      author: locus
      comment: Подпись Задачи удалена вместе с введёнными значениями
      changes:
        - dropColumn:
            tableName: problem
            columnName: caption

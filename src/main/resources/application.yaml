spring:
  application:
    name: locus

  docker:
    compose:
      # Приложение базу поднимает, но не гасит. По умолчанию (start-and-stop)
      # экземпляр, поднявший базу, гасит её при своей остановке — и если рядом
      # работает второй экземпляр, он остаётся на умершей базе и узнаёт об этом
      # не сразу, а при первом обращении к данным. Ошибка тихая.
      lifecycle-management: start-only

  # Схема базы меняется только миграциями; они накатываются при старте,
  # до того как приложение начнёт обслуживать запросы.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

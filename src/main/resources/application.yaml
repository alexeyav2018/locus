spring:
  application:
    name: locus

  docker:
    compose:
      # Приложение базу поднимает, но не гасит. По умолчанию (start-and-stop)
      # экземпляр, поднявший базу, гасит её при своей остановке — и если рядом
      # работает второй экземпляр, он остаётся на умершей базе и узнаёт об этом
      # не сразу, а при первом обращении к данным. Ошибка тихая.
      lifecycle-management: start-only

  # Схема базы меняется только миграциями; они накатываются при старте,
  # до того как приложение начнёт обслуживать запросы.
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  servlet:
    multipart:
      # Пределы загрузки. Умолчания Spring — 1 МБ на файл и 10 МБ на запрос —
      # не пропустят и одного снимка с телефона, а приём Работы — это
      # несколько снимков за раз: снимок — до 10 МБ, снимков — до десятка.
      # Пережатие изображения (locus.file.image) идёт ПОСЛЕ приёма, а не
      # вместо него: предел должен вместить исходник, не результат.
      max-file-size: 20MB
      max-request-size: 100MB
      # Разбор тела откладывается до обращения контроллера к файлам, а не
      # идёт до выбора обработчика: тогда превышение предела
      # (MaxUploadSizeExceededException) случается уже внутри обработчика,
      # и контроллер Работ показывает его текстом на экране приёма, как
      # отказ сервиса. При жадном разборе обработчик ещё не выбран, и отказ
      # уходил бы безликой страницей ошибки.
      resolve-lazily: true

# Файлы (ADR-0021). Наружу файл уходит только временной подписанной ссылкой —
# и у объектного хранилища, и у папки на диске.
locus:
  file:
    # local — папка на диске, для разработки; object — S3-совместимое
    # хранилище, для боевой. Умолчание локальное: `mvn spring-boot:run`
    # не должен требовать ключей от внешнего сервиса.
    storage: local

    # Сколько живёт выданная ссылка. Минуты, а не часы: ссылка попадает
    # в историю браузера и в адресную строку.
    link-ttl: 10m

    local:
      directory: ./.locus-files
      # Секрет подписи. Пустой — значит сгенерированный при старте: ссылки
      # не переживают перезапуск, и для разработки это приемлемо. В бою
      # работает объектное хранилище, которое подписывает своим ключом.
      secret: ""

    object:
      # Боевые значения приходят из окружения (deployment-backup), здесь
      # намеренно пусты: незаполненные роняют старт, а неверные умолчания
      # тихо уводят файлы не туда.
      endpoint: ""
      region: ""
      bucket: ""
      access-key: ""
      secret-key: ""

    image:
      # Предел по большей стороне и качество JPEG. Снимок с телефона приходит
      # многомегабайтным, а поток измеряется сотнями в неделю.
      max-side: 2000
      quality: 0.8
